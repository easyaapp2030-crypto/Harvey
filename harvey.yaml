persona:
  name: "Todd Temaat"
  company: "Junk Platoon"
  role: "Owner"
  email: "sameday@junkplatoon.com"
  linkedin: ""
  tone: "friendly, direct, no-nonsense — a local veteran-owned business, not a call center"

product:
  name: "Junk Platoon Junk Removal"
  description: "Veteran-owned junk removal in the Oklahoma City metro (based in Edmond, OK). Same-day and next-day hauling of furniture, appliances, debris and cleanouts for property managers, real estate agents and contractors."
  pricing: "Volume-based pricing — you pay for the space your junk takes up in the truck. Free, no-obligation quotes."
  key_benefits:
    - "Same-day and next-day service across the OKC metro — turn units, listings and job sites faster"
    - "Trained, insured and bonded crews"
    - "Upfront volume-based pricing with free quotes, no surprises"
    - "Veteran-owned and veteran-staffed; 10% of profits support veteran entrepreneurship and PTSD resources"
    - "Strong local reviews (about 4.8 on Trustpilot, 4.6 on HomeAdvisor)"
  objection_responses:
    "too expensive": "Totally fair. Pricing is by volume, so you only pay for what we haul — and a quick photo is usually enough for a firm quote. Happy to price your next one so you can compare."
    "already have a solution": "Makes sense. A lot of our property managers and contractors keep us as the backup for when their usual hauler can't come same-day. Worth having our number for that?"
    "not interested": "No problem at all. If a move-out or cleanout ever lands on your desk with a deadline, we're local and can usually be there the same or next day."
    "we do it ourselves": "Plenty of folks do. Where we usually help is the big ones — full-unit trash-outs, estate cleanouts, construction debris — where a crew and a truck saves your team a day."
  offer:
    primary: "On-call junk removal for property managers, agents and contractors — same/next-day cleanouts, trash-outs and debris haul-off"
    entry: "Free quote on their next cleanout (photo or on-site)"
    goal: "get_reply"
    booking_method: "ask_preference"
    booking_url: ""
    meeting_duration: "10 minutes"
    meeting_owner: "Todd Temaat"

icp:
  industries:
    - "property management company"
    - "real estate agency"
    - "general contractor"
  company_size: "1-200 employees"
  titles:
    - "Property Manager"
    - "Community Manager"
    - "Regional Property Manager"
    - "Maintenance Supervisor"
    - "Real Estate Agent"
    - "Broker"
    - "Owner"
    - "Project Manager"
    - "Superintendent"
  geography:
    - "Edmond, OK"
  # Centered on Edmond, 48 km (~30 miles) — covers OKC, Moore, Norman edge,
  # Yukon, Mustang, Midwest City, Guthrie.
  geo_coordinates:
    "Edmond, OK": "35.6528,-97.4781,48"
  # Companies hiring these are turning units / running jobs right now.
  hiring_signals:
    - "Make Ready Technician"
    - "Property Manager"
    - "Leasing Agent"
    - "Construction Superintendent"

channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recommended) | smtp | instantly
    max_daily_sends: 50
    require_approval: true      # native providers: emails wait in the Outbox
    send_to_risky: false        # also send to catch-all domains (off = safest)
    max_bounce_rate: 0.05       # pause all sending if bounces exceed this
  linkedin:
    enabled: true
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/Chicago"
