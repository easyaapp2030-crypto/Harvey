persona:
  name: "Todd Temaat"
  company: "Junk Platoon"
  role: "Owner"
  email: "sameday@junkplatoon.com"
  linkedin: ""
  tone: "friendly, direct, no-nonsense — a local veteran-owned business, not a call center"

product:
  name: "Junk Platoon Junk Removal"
  description: "Veteran-owned junk removal, property cleanouts and roll-off dumpster rental in the Oklahoma City metro (based in Edmond, OK). Same-day service at a commercial rate, no contract, for property managers, real estate agents and contractors."
  pricing: "Commercial rate for property managers, agents and contractors, no contract. Junk removal is priced by volume; quotes by text from a photo."
  key_benefits:
    - "Same-day service across the OKC metro — turn units, listings and job sites faster"
    - "One call covers it: full-service haul-away, property cleanouts, or a 15- or 20-yard roll-off dumpster dropped on site"
    - "Commercial rate with no contract — use us when you need us"
    - "Trained, insured and bonded crews"
    - "Veteran-owned and veteran-staffed; 10% of profits support veteran entrepreneurship and PTSD resources"
    - "Strong local reviews (about 4.8 on Trustpilot, 4.6 on HomeAdvisor)"
  objection_responses:
    "too expensive": "Totally fair. Pricing is by volume, so you only pay for what we haul — and a quick photo is usually enough for a firm quote. Happy to price your next one so you can compare."
    "already have a solution": "Makes sense. Since there's no contract, a lot of property managers and contractors keep us as the backup for when their usual hauler or dumpster company can't come same day."
    "not interested": "No problem at all. If a move-out or cleanout ever lands on your desk with a deadline, we're local and can usually be there the same or next day."
    "we do it ourselves": "Plenty of folks do. If your crew would rather load it themselves, we can drop a roll-off dumpster same day. For full-unit trash-outs and estate cleanouts, our crew does the lifting and saves your team a day."
  offer:
    primary: "Same-day junk removal, property cleanouts and roll-off dumpster rental at a commercial rate, no contract"
    entry: "Text a photo of the job to 405-266-4412 for a same-day quote"
    goal: "get_reply"
    booking_method: "ask_preference"   # no meetings: interested prospects text photos to 405-266-4412 (see skills/product_knowledge.md)
    booking_url: ""
    meeting_duration: "10 minutes"
    meeting_owner: "Todd Temaat"

icp:
  industries:
    - "property management company"
    - "real estate agency"
    - "general contractor"
  company_size: "1-200 employees"
  titles:
    - "Property Manager"
    - "Community Manager"
    - "Regional Property Manager"
    - "Maintenance Supervisor"
    - "Real Estate Agent"
    - "Broker"
    - "Owner"
    - "Project Manager"
    - "Superintendent"
  geography:
    - "Edmond, OK"
  # Centered on Edmond, 48 km (~30 miles) — covers OKC, Moore, Norman edge,
  # Yukon, Mustang, Midwest City, Guthrie.
  geo_coordinates:
    "Edmond, OK": "35.6528,-97.4781,48"
  # Companies hiring these are turning units / running jobs right now.
  hiring_signals:
    - "Make Ready Technician"
    - "Property Manager"
    - "Leasing Agent"
    - "Construction Superintendent"

channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recommended) | smtp | instantly
    max_daily_sends: 50
    require_approval: true      # native providers: emails wait in the Outbox
    send_to_risky: false        # also send to catch-all domains (off = safest)
    max_bounce_rate: 0.05       # pause all sending if bounces exceed this
  linkedin:
    enabled: true
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/Chicago"
